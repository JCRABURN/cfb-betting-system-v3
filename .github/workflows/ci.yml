name: Pull Request Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11.17'
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.11.9'
          - os: windows-latest
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py

      - name: Verify migrations on a disposable database copy
        run: python -m scripts.verify_migrations

      - name: Verify managed PostgreSQL migration inventory
        run: python -m scripts.verify_cloud_migrations

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify exact historical audit and prospective custody
        run: python -m scripts.verify_replay_compat --output replay-verification/compatibility.json

      - name: Capture native replay comparisons
        if: always() && steps.python.outcome == 'success'
        run: python -m scripts.diagnose_cross_platform_replay --output replay-diagnostics

      - name: Archive replay comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.os }}-${{ matrix.python }}
          path: |
            replay-diagnostics/
            replay-verification/
          if-no-files-found: error
