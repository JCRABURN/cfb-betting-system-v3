name: Pull Request Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py

      - name: Verify migrations on a disposable database copy
        run: python -m scripts.verify_migrations

      - name: Run complete test suite
        run: python -m pytest -q
