name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
      - codex/2026-week10-splashsports-ingest

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11.17'
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.11.9'
          - os: windows-latest
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Test the exact reviewed PR head, including its integrated main history.
          ref: ${{ github.event.pull_request.head.sha }}
          # Replay checks compare execution code to its original commit.
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py

      - name: Verify both integration parents and preserved evidence
        run: python -m scripts.verify_week12_integration

      - name: Verify migrations on a disposable database copy
        run: python -m scripts.verify_migrations

      - name: Verify managed PostgreSQL migration inventory
        run: python -m scripts.verify_cloud_migrations

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Verify exact historical audit and prospective custody
        run: python -m scripts.verify_replay_compat --output replay-verification/compatibility.json

      - name: Verify corrected Week 7 indexed source and forecast custody
        run: python -m scripts.verify_week7_corrected_git_custody

      - name: Verify exact Week 9 formal postgame audit
        run: python -m scripts.build_week9_formal_audit --verify

      - name: Verify Week 9 scoring-process supersession
        run: python -m scripts.week9_scoring_process_v2 --verify

      - name: Capture native replay comparisons
        if: always() && steps.python.outcome == 'success'
        run: python -m scripts.diagnose_cross_platform_replay --output replay-diagnostics

      - name: Archive replay comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.os }}-${{ matrix.python }}
          path: |
            replay-diagnostics/
            replay-verification/
          if-no-files-found: error

      - name: Verify exact Week 10 prospective custody
        run: python -m scripts.verify_week10_acceptance

      - name: Verify exact Week 10 forensic audit and prospective research grading
        run: python -m scripts.build_week10_formal_audit --verify

      - name: Verify Week 12 source, complete coverage and declared calibration gaps
        run: python -m scripts.verify_week12_acceptance

      - name: Verify Week 12 actual seal qualifications on complete delivery
        run: python -m scripts.qualify_week12_delivery --verify

      - name: Verify append-only Week 12 Thursday research refresh
        run: python -m scripts.review_week12_thursday --verify

      - name: Verify Week 12 Thursday context and eligibility provenance
        run: python -m scripts.review_week12_context --capture outputs/2026-week12-context/20261119-morning --conference outputs/2026-week12-context/20261119-conference --eligibility-capture outputs/2026-week12-readiness/20261119-morning --output outputs/2026-week12-context/20261119-review-v2 --verify

      - name: Verify Week 12 Friday context and eligibility provenance
        run: python -m scripts.review_week12_context --capture outputs/2026-week12-context/20261120-morning --conference outputs/2026-week12-context/20261120-conference --eligibility-capture outputs/2026-week12-readiness/20261120-morning --output outputs/2026-week12-context/20261120-review --verify

      - name: Verify append-only Friday refresh and unchanged historical card
        run: python -m scripts.build_week12_daily_refresh --previous-context outputs/2026-week12-context/20261119-review-v2 --previous-capture outputs/2026-week12-context/20261119-morning --context outputs/2026-week12-context/20261120-review --capture outputs/2026-week12-context/20261120-morning --previous-card outputs/2026-week12-refresh/20261119-morning/full-card-66.csv --output outputs/2026-week12-refresh/20261120-morning --verify

      - name: Verify Week 11 source custody and schedule readiness without contest lines
        run: python -m scripts.prepare_week11_readiness --verify

      - name: Verify separate Week 11 preparation research diagnostics
        run: python -m research.week11_validation.anchor_diagnostics_v2 --verify

      - name: Verify concurrent owner transcription custody and elapsed-game gate
        run: python -m scripts.verify_week11_transcription

      - name: Verify Week 11 complete board, explicit late custody and separate research
        run: python -m scripts.verify_week11_acceptance

      - name: Verify integrated Week 11 forensic and recovered season audit
        run: python -m scripts.build_week11_formal_audit --verify

      - name: Verify season workbook formulas and cached grades
        run: python -m scripts.verify_week11_workbook

      - name: Verify frozen pregame to postgame context comparison
        run: python -m scripts.week11_context_postgame --verify
