name: V3 Production Operations Gate

on:
  schedule:
    # Dispatcher heartbeat only. Paid provider calls require an exact weekly-config entry.
    - cron: '7,22,37,52 * * * 1-6'
  workflow_dispatch:
    inputs:
      operation:
        description: Governed operating stage
        required: true
        type: choice
        options:
          - tuesday_lock
          - wednesday_refresh
          - thursday_refresh
          - friday_refresh
          - saturday_final
          - sportsbook_refresh
          - postgame_grading
          - weekly_audit
      operation_instance:
        description: YYYYMMDDTHHMMZ for sportsbook_refresh; blank otherwise
        required: false
        type: string
      season:
        description: Four-digit CFB season
        required: true
        type: string
      week:
        description: CFB week number
        required: true
        type: string
      confirmation:
        description: Enter RUN_V3_OPERATION after completing the runbook
        required: true
        type: string

concurrency:
  # PostgreSQL is authoritative; this stricter queue prevents any repository writer overlap.
  group: v3-production-writer-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard-rejected:
    if: >-
      github.repository != 'JCRABURN/cfb-betting-system-v3' ||
      vars.CFB_V3_PRODUCTION_ENABLED != 'true' ||
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED != 'true' ||
      vars.CFB_V3_KILL_SWITCH != 'false' ||
      vars.CFB_V3_OWNER_CUTOVER_APPROVED != 'true' ||
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED != 'true' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirmation != 'RUN_V3_OPERATION')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record rejected authorization
        run: |
          {
            echo "## V3 production operation rejected"
            echo "An authorization or kill-switch guard blocked the request."
            echo "No checkout, credential access, API call, or database operation occurred."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  resolve-operation:
    if: >-
      github.repository == 'JCRABURN/cfb-betting-system-v3' &&
      vars.CFB_V3_PRODUCTION_ENABLED == 'true' &&
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED == 'true' &&
      vars.CFB_V3_KILL_SWITCH == 'false' &&
      vars.CFB_V3_OWNER_CUTOVER_APPROVED == 'true' &&
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED == 'true' &&
      (github.event_name == 'schedule' ||
       inputs.confirmation == 'RUN_V3_OPERATION')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      status: ${{ steps.resolve.outputs.status }}
      reason: ${{ steps.resolve.outputs.reason }}
      should-run: ${{ steps.resolve.outputs.should-run }}
      operation: ${{ steps.resolve.outputs.operation }}
      operation-instance: ${{ steps.resolve.outputs.operation-instance }}
      scheduled-for: ${{ steps.resolve.outputs.scheduled-for }}
      next-scheduled-refresh: ${{ steps.resolve.outputs.next-scheduled-refresh }}
      season: ${{ steps.resolve.outputs.season }}
      week: ${{ steps.resolve.outputs.week }}
    env:
      CFB_V3_WEEKLY_CONFIG_FILE: ${{ vars.CFB_V3_WEEKLY_CONFIG_FILE }}
      V3_EVENT_NAME: ${{ github.event_name }}
      V3_MANUAL_OPERATION: ${{ inputs.operation }}
      V3_MANUAL_OPERATION_INSTANCE: ${{ inputs.operation_instance }}
      V3_MANUAL_SEASON: ${{ inputs.season }}
      V3_MANUAL_WEEK: ${{ inputs.week }}
    steps:
      - name: Checkout exact default-branch commit
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py

      - name: Resolve governed operation without credentials
        id: resolve
        run: >-
          python -m scripts.resolve_production_schedule
          --event-name "$V3_EVENT_NAME"
          --weekly-config "$CFB_V3_WEEKLY_CONFIG_FILE"
          --manual-operation "$V3_MANUAL_OPERATION"
          --manual-operation-instance "$V3_MANUAL_OPERATION_INSTANCE"
          --manual-season "$V3_MANUAL_SEASON"
          --manual-week "$V3_MANUAL_WEEK"

  idle-heartbeat:
    needs: resolve-operation
    if: needs.resolve-operation.outputs.status == 'idle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record API-free idle heartbeat
        run: |
          {
            echo "## V3 production schedule idle"
            echo "${{ needs.resolve-operation.outputs.reason }}"
            echo "No credential access, API call, or database operation occurred."
          } >> "$GITHUB_STEP_SUMMARY"

  guarded-operation:
    needs: resolve-operation
    if: >-
      needs.resolve-operation.outputs.should-run == 'true' &&
      github.repository == 'JCRABURN/cfb-betting-system-v3' &&
      vars.CFB_V3_PRODUCTION_ENABLED == 'true' &&
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED == 'true' &&
      vars.CFB_V3_KILL_SWITCH == 'false' &&
      vars.CFB_V3_OWNER_CUTOVER_APPROVED == 'true' &&
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED == 'true' &&
      (github.event_name == 'schedule' ||
       inputs.confirmation == 'RUN_V3_OPERATION')
    environment: v3-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      dashboard-ready: ${{ steps.dashboard-gate.outputs.ready }}
    permissions:
      contents: read
      pages: read
    env:
      CFB_V3_RUNTIME_MODE: production
      CFB_V3_PRODUCTION_ENABLED: ${{ vars.CFB_V3_PRODUCTION_ENABLED }}
      CFB_V3_OPERATION_EXECUTION_ENABLED: ${{ vars.CFB_V3_OPERATION_EXECUTION_ENABLED }}
      CFB_V3_KILL_SWITCH: ${{ vars.CFB_V3_KILL_SWITCH }}
      CFB_V3_OWNER_CUTOVER_APPROVED: ${{ vars.CFB_V3_OWNER_CUTOVER_APPROVED }}
      CFB_V3_REPOSITORY: JCRABURN/cfb-betting-system-v3
      CFB_V3_PERSISTENCE_BACKEND: managed_postgresql
      CFB_V3_WEEKLY_CONFIG_FILE: ${{ vars.CFB_V3_WEEKLY_CONFIG_FILE }}
      CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED }}
      CFB_V3_PROVIDER_CONNECTIVITY_VERIFIED_AT: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_VERIFIED_AT }}
      CFB_V3_SEASON: ${{ needs.resolve-operation.outputs.season }}
      CFB_V3_WEEK: ${{ needs.resolve-operation.outputs.week }}
      CFB_V3_OPERATION_INSTANCE: ${{ needs.resolve-operation.outputs.operation-instance }}
      CFB_V3_CONTEST_KEY: ${{ vars.CFB_V3_CONTEST_KEY }}
      CFB_V3_CONTEST_NAME: ${{ vars.CFB_V3_CONTEST_NAME }}
      CFB_V3_SOURCE_CONTEST_ID: ${{ vars.CFB_V3_SOURCE_CONTEST_ID }}
      CFB_V3_CONTEST_SOURCE: SplashSports
      CFB_V3_EXPECTED_LINED_GAME_COUNT: ${{ vars.CFB_V3_EXPECTED_LINED_GAME_COUNT }}
      CFB_V3_CONTEST_LINES_FILE: ${{ vars.CFB_V3_CONTEST_LINES_FILE }}
      CFB_V3_CONTEST_LINES_SHA256: ${{ vars.CFB_V3_CONTEST_LINES_SHA256 }}
      CFB_V3_MODEL_NAME: epa_only
      CFB_V3_MODEL_VERSION: epa-only-linear-v1
      CFB_V3_FEATURE_SCHEMA_VERSION: epa-differential-v1
      CFB_V3_CONFIGURATION_VERSION: walk-forward-prior-seasons-v1
      CFB_V3_CONTROLLER_POLICY_VERSION: ${{ vars.CFB_V3_CONTROLLER_POLICY_VERSION }}
      CFB_V3_SELECTION_POLICY_VERSION: ${{ vars.CFB_V3_SELECTION_POLICY_VERSION }}
      CFB_V3_CONFIDENCE_POLICY_VERSION: ${{ vars.CFB_V3_CONFIDENCE_POLICY_VERSION }}
      CFB_V3_RANKING_POLICY_VERSION: ${{ vars.CFB_V3_RANKING_POLICY_VERSION }}
      CFB_V3_ADJUSTMENT_POLICY_VERSION: ${{ vars.CFB_V3_ADJUSTMENT_POLICY_VERSION }}
      CFB_V3_REFRESH_POLICY_VERSION: ${{ vars.CFB_V3_REFRESH_POLICY_VERSION }}
      CFB_V3_AUDIT_POLICY_VERSION: ${{ vars.CFB_V3_AUDIT_POLICY_VERSION }}
      CFB_V3_DIAGNOSTICS_POLICY_VERSION: ${{ vars.CFB_V3_DIAGNOSTICS_POLICY_VERSION }}
      CFB_V3_SPORTSBOOK_POLICY_VERSION: ${{ vars.CFB_V3_SPORTSBOOK_POLICY_VERSION }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CFB_V3_DATABASE_URL: ${{ secrets.CFB_V3_DATABASE_URL }}

    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py

      - name: Run guarded operation
        id: operation
        run: >-
          python -m scripts.run_cloud_production_operation
          --operation "${{ needs.resolve-operation.outputs.operation }}"
          --weekly-config "${{ vars.CFB_V3_WEEKLY_CONFIG_FILE }}"
          --confirmation EXECUTE_V3_CLOUD_OPERATION
          --capture-provider-data
          --provider-confirmation CAPTURE_V3_PROVIDER_PAYLOADS
          --preflight-output "$RUNNER_TEMP/v3-production-preflight.json"
          --result-output "$RUNNER_TEMP/v3-production-result.json"
          --pages-output "$RUNNER_TEMP/v3-pages-site"

      - name: Mark validated dashboard artifact ready
        id: dashboard-gate
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sanitized Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/v3-pages-site

      - name: Upload redacted preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-production-preflight-${{ needs.resolve-operation.outputs.season }}-${{ needs.resolve-operation.outputs.week }}-${{ needs.resolve-operation.outputs.operation }}
          path: ${{ runner.temp }}/v3-production-preflight.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload redacted operation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-production-result-${{ needs.resolve-operation.outputs.season }}-${{ needs.resolve-operation.outputs.week }}-${{ needs.resolve-operation.outputs.operation }}
          path: ${{ runner.temp }}/v3-production-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload checksummed provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-provider-evidence-${{ needs.resolve-operation.outputs.season }}-${{ needs.resolve-operation.outputs.week }}-${{ needs.resolve-operation.outputs.operation }}
          path: data/provider_evidence/cloud-*
          if-no-files-found: ignore
          retention-days: 90

      - name: Record operation outcome
        if: always()
        run: |
          {
            echo "## V3 production operation"
            echo "- Operation: ${{ needs.resolve-operation.outputs.operation }}"
            echo "- Season/week: ${{ needs.resolve-operation.outputs.season }}/${{ needs.resolve-operation.outputs.week }}"
            echo "- Scheduled for: ${{ needs.resolve-operation.outputs.scheduled-for || 'manual dispatch' }}"
            echo "- Outcome: ${{ steps.operation.outcome }}"
            echo "- The adapter executes only after every preflight gate passes."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy sanitized V3 dashboard
    needs: guarded-operation
    if: >-
      needs.guarded-operation.result == 'success' &&
      needs.guarded-operation.outputs.dashboard-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
