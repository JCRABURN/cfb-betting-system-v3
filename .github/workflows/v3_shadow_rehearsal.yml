name: V3 Controlled Live-Week Shadow Rehearsal

on:
  # Recurring schedules remain intentionally absent until PR #22 authorization.
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled shadow stage
        required: true
        type: choice
        options:
          - initialize
          - connectivity_check
          - tuesday_lock
          - wednesday_refresh
          - thursday_refresh
          - friday_refresh
          - saturday_final
          - postgame_grading
          - weekly_audit
      season:
        description: Four-digit CFB season
        required: true
        type: string
      week:
        description: CFB week number
        required: true
        type: string
      confirmation:
        description: Enter RUN_V3_SHADOW_REHEARSAL after reviewing the runbook
        required: true
        type: string

concurrency:
  group: v3-shadow-${{ github.repository }}-${{ inputs.season }}-${{ inputs.week }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard-rejected:
    if: >-
      github.repository != 'JCRABURN/cfb-betting-system-v3' ||
      vars.CFB_V3_PRODUCTION_ENABLED != 'false' ||
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED != 'false' ||
      vars.CFB_V3_KILL_SWITCH != 'true' ||
      vars.CFB_V3_OWNER_CUTOVER_APPROVED != 'false' ||
      vars.CFB_V3_SHADOW_REHEARSAL_ENABLED != 'true' ||
      vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED != 'true' ||
      vars.CFB_V3_SHADOW_KILL_SWITCH != 'false' ||
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED != 'true' ||
      inputs.confirmation != 'RUN_V3_SHADOW_REHEARSAL'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record rejected authorization
        run: |
          {
            echo "## V3 shadow rehearsal rejected"
            echo "A shadow authorization, production-isolation, provider, or kill-switch guard blocked the request."
            echo "No checkout, credential access, API call, or database operation occurred."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  initialize:
    if: >-
      inputs.operation == 'initialize' &&
      github.repository == 'JCRABURN/cfb-betting-system-v3' &&
      vars.CFB_V3_PRODUCTION_ENABLED == 'false' &&
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED == 'false' &&
      vars.CFB_V3_KILL_SWITCH == 'true' &&
      vars.CFB_V3_OWNER_CUTOVER_APPROVED == 'false' &&
      vars.CFB_V3_SHADOW_REHEARSAL_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_KILL_SWITCH == 'false' &&
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED == 'true' &&
      inputs.confirmation == 'RUN_V3_SHADOW_REHEARSAL'
    environment: v3-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CFB_V3_RUNTIME_MODE: shadow
      CFB_V3_PRODUCTION_ENABLED: 'false'
      CFB_V3_OPERATION_EXECUTION_ENABLED: 'false'
      CFB_V3_KILL_SWITCH: 'true'
      CFB_V3_OWNER_CUTOVER_APPROVED: 'false'
      CFB_V3_SHADOW_REHEARSAL_ENABLED: ${{ vars.CFB_V3_SHADOW_REHEARSAL_ENABLED }}
      CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED: ${{ vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED }}
      CFB_V3_SHADOW_KILL_SWITCH: ${{ vars.CFB_V3_SHADOW_KILL_SWITCH }}
      CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED }}
      CFB_V3_DATABASE_URL: ${{ secrets.CFB_V3_DATABASE_URL }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py
      - name: Initialize isolated shadow stream
        id: initialize
        run: >-
          python -m scripts.prepare_cloud_shadow_database
          --seed data/cfb.db
          --policy-config config/production_policies.example.json
          --season "${{ inputs.season }}"
          --week "${{ inputs.week }}"
          --actor "${{ github.actor }}"
          --confirmation INITIALIZE_V3_CLOUD_SHADOW_REHEARSAL
          --report-output "$RUNNER_TEMP/v3-shadow-initialization.json"
      - name: Upload redacted initialization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-shadow-initialization-${{ inputs.season }}-${{ inputs.week }}
          path: ${{ runner.temp }}/v3-shadow-initialization.json
          if-no-files-found: ignore
          retention-days: 30

  connectivity-check:
    if: >-
      inputs.operation == 'connectivity_check' &&
      github.repository == 'JCRABURN/cfb-betting-system-v3' &&
      vars.CFB_V3_PRODUCTION_ENABLED == 'false' &&
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED == 'false' &&
      vars.CFB_V3_KILL_SWITCH == 'true' &&
      vars.CFB_V3_OWNER_CUTOVER_APPROVED == 'false' &&
      vars.CFB_V3_SHADOW_REHEARSAL_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_KILL_SWITCH == 'false' &&
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED == 'true' &&
      inputs.confirmation == 'RUN_V3_SHADOW_REHEARSAL'
    environment: v3-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFB_V3_RUNTIME_MODE: shadow
      CFB_V3_PRODUCTION_ENABLED: 'false'
      CFB_V3_OPERATION_EXECUTION_ENABLED: 'false'
      CFB_V3_KILL_SWITCH: 'true'
      CFB_V3_OWNER_CUTOVER_APPROVED: 'false'
      CFB_V3_SHADOW_REHEARSAL_ENABLED: ${{ vars.CFB_V3_SHADOW_REHEARSAL_ENABLED }}
      CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED: ${{ vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED }}
      CFB_V3_SHADOW_KILL_SWITCH: ${{ vars.CFB_V3_SHADOW_KILL_SWITCH }}
      CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py
      - name: Run minimal credential-safe connectivity checks
        id: connectivity
        run: |
          mkdir -p data/provider_evidence
          python -m scripts.check_provider_connectivity \
            --season "${{ inputs.season }}" \
            --confirmation AUTHORIZE_V3_CONNECTIVITY \
            --output "data/provider_evidence/shadow-connectivity-${{ github.run_id }}.json"
      - name: Upload redacted connectivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-shadow-connectivity-${{ inputs.season }}-${{ inputs.week }}
          path: data/provider_evidence/shadow-connectivity-*.json
          if-no-files-found: error
          retention-days: 90

  governed-operation:
    if: >-
      inputs.operation != 'initialize' &&
      inputs.operation != 'connectivity_check' &&
      github.repository == 'JCRABURN/cfb-betting-system-v3' &&
      vars.CFB_V3_PRODUCTION_ENABLED == 'false' &&
      vars.CFB_V3_OPERATION_EXECUTION_ENABLED == 'false' &&
      vars.CFB_V3_KILL_SWITCH == 'true' &&
      vars.CFB_V3_OWNER_CUTOVER_APPROVED == 'false' &&
      vars.CFB_V3_SHADOW_REHEARSAL_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED == 'true' &&
      vars.CFB_V3_SHADOW_KILL_SWITCH == 'false' &&
      vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED == 'true' &&
      inputs.confirmation == 'RUN_V3_SHADOW_REHEARSAL'
    environment: v3-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      dashboard-ready: ${{ steps.dashboard-gate.outputs.ready }}
    permissions:
      contents: read
      pages: read
    env:
      CFB_V3_RUNTIME_MODE: shadow
      CFB_V3_PRODUCTION_ENABLED: 'false'
      CFB_V3_OPERATION_EXECUTION_ENABLED: 'false'
      CFB_V3_KILL_SWITCH: 'true'
      CFB_V3_OWNER_CUTOVER_APPROVED: 'false'
      CFB_V3_SHADOW_REHEARSAL_ENABLED: ${{ vars.CFB_V3_SHADOW_REHEARSAL_ENABLED }}
      CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED: ${{ vars.CFB_V3_SHADOW_OPERATION_EXECUTION_ENABLED }}
      CFB_V3_SHADOW_KILL_SWITCH: ${{ vars.CFB_V3_SHADOW_KILL_SWITCH }}
      CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_AUTHORIZED }}
      CFB_V3_DATABASE_URL: ${{ secrets.CFB_V3_DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GITHUB_REPOSITORY: JCRABURN/cfb-betting-system-v3
      CFB_V3_REPOSITORY: JCRABURN/cfb-betting-system-v3
      CFB_V3_PERSISTENCE_BACKEND: managed_postgresql
      CFB_V3_WEEKLY_CONFIG_FILE: ${{ vars.CFB_V3_WEEKLY_CONFIG_FILE }}
      CFB_V3_PROVIDER_CONNECTIVITY_VERIFIED_AT: ${{ vars.CFB_V3_PROVIDER_CONNECTIVITY_VERIFIED_AT }}
      CFB_V3_SEASON: ${{ inputs.season }}
      CFB_V3_WEEK: ${{ inputs.week }}
      CFB_V3_CONTEST_KEY: ${{ vars.CFB_V3_CONTEST_KEY }}
      CFB_V3_CONTEST_NAME: ${{ vars.CFB_V3_CONTEST_NAME }}
      CFB_V3_SOURCE_CONTEST_ID: ${{ vars.CFB_V3_SOURCE_CONTEST_ID }}
      CFB_V3_CONTEST_SOURCE: SplashSports
      CFB_V3_EXPECTED_LINED_GAME_COUNT: ${{ vars.CFB_V3_EXPECTED_LINED_GAME_COUNT }}
      CFB_V3_CONTEST_LINES_FILE: ${{ vars.CFB_V3_CONTEST_LINES_FILE }}
      CFB_V3_CONTEST_LINES_SHA256: ${{ vars.CFB_V3_CONTEST_LINES_SHA256 }}
      CFB_V3_MODEL_NAME: epa_only
      CFB_V3_MODEL_VERSION: epa-only-linear-v1
      CFB_V3_FEATURE_SCHEMA_VERSION: epa-differential-v1
      CFB_V3_CONFIGURATION_VERSION: walk-forward-prior-seasons-v1
      CFB_V3_CONTROLLER_POLICY_VERSION: ${{ vars.CFB_V3_CONTROLLER_POLICY_VERSION }}
      CFB_V3_SELECTION_POLICY_VERSION: ${{ vars.CFB_V3_SELECTION_POLICY_VERSION }}
      CFB_V3_CONFIDENCE_POLICY_VERSION: ${{ vars.CFB_V3_CONFIDENCE_POLICY_VERSION }}
      CFB_V3_RANKING_POLICY_VERSION: ${{ vars.CFB_V3_RANKING_POLICY_VERSION }}
      CFB_V3_ADJUSTMENT_POLICY_VERSION: ${{ vars.CFB_V3_ADJUSTMENT_POLICY_VERSION }}
      CFB_V3_REFRESH_POLICY_VERSION: ${{ vars.CFB_V3_REFRESH_POLICY_VERSION }}
      CFB_V3_AUDIT_POLICY_VERSION: ${{ vars.CFB_V3_AUDIT_POLICY_VERSION }}
      CFB_V3_DIAGNOSTICS_POLICY_VERSION: ${{ vars.CFB_V3_DIAGNOSTICS_POLICY_VERSION }}
      CFB_V3_SPORTSBOOK_POLICY_VERSION: ${{ vars.CFB_V3_SPORTSBOOK_POLICY_VERSION }}
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify repository safety controls
        run: python scripts/verify_repo_safety.py
      - name: Run isolated governed shadow operation
        id: operation
        run: >-
          python -m scripts.run_cloud_production_operation
          --operation "${{ inputs.operation }}"
          --weekly-config "${{ vars.CFB_V3_WEEKLY_CONFIG_FILE }}"
          --confirmation EXECUTE_V3_CLOUD_SHADOW_REHEARSAL
          --capture-provider-data
          --provider-confirmation CAPTURE_V3_PROVIDER_PAYLOADS
          --preflight-output "$RUNNER_TEMP/v3-shadow-preflight.json"
          --result-output "$RUNNER_TEMP/v3-shadow-result.json"
          --pages-output "$RUNNER_TEMP/v3-pages-site"
      - name: Mark validated dashboard artifact ready
        id: dashboard-gate
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload sanitized Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/v3-pages-site
      - name: Publish owner-facing DraftKings betting board
        if: >-
          steps.operation.outcome == 'success' &&
          (inputs.operation == 'tuesday_lock' ||
          inputs.operation == 'wednesday_refresh' ||
          inputs.operation == 'thursday_refresh' ||
          inputs.operation == 'friday_refresh' ||
          inputs.operation == 'saturday_final')
        run: |
          {
            echo "## DRAFTKINGS BETTING BOARD"
            jq -r '.draftkings_betting_board_text[1:][] | "- `" + . + "`"' \
              "$RUNNER_TEMP/v3-shadow-result.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted shadow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-shadow-${{ inputs.season }}-${{ inputs.week }}-${{ inputs.operation }}
          path: |
            ${{ runner.temp }}/v3-shadow-preflight.json
            ${{ runner.temp }}/v3-shadow-result.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload checksummed provider evidence
        if: always() && inputs.operation != 'weekly_audit'
        uses: actions/upload-artifact@v4
        with:
          name: v3-shadow-provider-${{ inputs.season }}-${{ inputs.week }}-${{ inputs.operation }}
          path: data/provider_evidence/cloud-*
          if-no-files-found: error
          retention-days: 90
      - name: Record shadow outcome
        if: always()
        run: |
          {
            echo "## V3 controlled live-week shadow rehearsal"
            echo "- Operation: ${{ inputs.operation }}"
            echo "- Season/week: ${{ inputs.season }}/${{ inputs.week }}"
            echo "- Outcome: ${{ steps.operation.outcome }}"
            echo "- Production flags remained disabled and the production kill switch remained engaged."
            echo "- Wager placement is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy sanitized V3 shadow dashboard
    needs: governed-operation
    if: >-
      needs.governed-operation.result == 'success' &&
      needs.governed-operation.outputs.dashboard-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
